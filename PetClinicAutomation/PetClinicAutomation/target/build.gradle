plugins {
    id 'java'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '5.3.9'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

dependencies {
    // Main scope — necesario para src/main/java
    implementation 'net.serenity-bdd:serenity-core:5.3.9'
    implementation 'net.serenity-bdd:serenity-cucumber:5.3.9'
    implementation 'net.serenity-bdd:serenity-screenplay:5.3.9'
    implementation 'net.serenity-bdd:serenity-screenplay-webdriver:5.3.9'
    implementation 'io.github.bonigarcia:webdrivermanager:5.6.3'

    // Test scope
    testImplementation 'io.cucumber:cucumber-java:7.15.0'
    testImplementation 'io.cucumber:cucumber-junit:7.15.0'
    testImplementation 'junit:junit:4.13.2'
}

test {
    systemProperty 'webdriver.driver', System.getProperty('webdriver.driver', 'chrome')
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

serenity {
    reports = ['single-page-html']
}
