webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    browserName = "chrome"
    "goog:chromeOptions" {
      args = ["--start-maximized", "--disable-notifications", "--disable-popup-blocking"]
    }
  }
}

headless.mode = false

serenity {
  project.name = "PetClinic Automation"
  take.screenshots = FOR_EACH_ACTION
  reports.show.step.details = true
}

environments {
  default {
    webdriver.base.url = "http://localhost:3000"
  }
}
